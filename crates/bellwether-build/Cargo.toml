[package]
name = "bellwether-build"
description = "Index builder for Bellwether: discover, fingerprint, assign row-group ids, parallel segments, one manifest commit; incremental builds, compaction, verify, and scan plans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bellwether-types = { path = "../bellwether-types" }
bellwether-core = { path = "../bellwether-core" }
bellwether-source = { path = "../bellwether-source" }
bellwether-store = { path = "../bellwether-store" }
arrow = { workspace = true }
bytes = { workspace = true }
rayon = { workspace = true }
roaring = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
arrow = { workspace = true, features = ["csv", "json"] }
parquet = { workspace = true, features = ["arrow"] }
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

[[bench]]
name = "build"
harness = false

[lints]
workspace = true
