[package]
name = "bellwether-types"
description = "Shared records, traits, and format constants for the Bellwether engine. No logic lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
roaring = { workspace = true, features = ["serde"] }
arrow = { workspace = true }
# Only with the `schema` feature.
schemars = { workspace = true, optional = true }

[features]
# JSON Schema derives (`schemars::JsonSchema`) on the public records and
# enums, for the MCP server's tool schemas (WP12). Non-semantic: it changes
# no serialization, no hash, and nothing in the default build.
schema = ["dep:schemars"]

[lints]
workspace = true
