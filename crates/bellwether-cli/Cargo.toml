[package]
name = "bellwether-cli"
description = "The bellwether command: why, index, locate, latest, asof, propose, fix, receipt show, report, ledger, mcp; formatting and argument parsing over the facade only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "bellwether"
path = "src/main.rs"
# The binary is documented by its --help; its doc comments are clap help
# text, and rustdoc output would collide with the facade library `bellwether`.
doc = false

[features]
# SQL Server tables through ODBC (links the system ODBC driver manager).
odbc = ["bellwether/odbc"]
# The DataFusion adapter's executable form, for the `--emit datafusion`
# end-to-end tests that run the emitted scan (tests/emit.rs); the binary
# prints the scan description and runs nothing either way.
datafusion = ["bellwether-adapters/datafusion"]

[dependencies]
bellwether = { path = "../bellwether" }
# The `bench` subcommand only (and the end-to-end tests' planted corpus).
bellwether-bench = { path = "../bellwether-bench" }
# The `mcp` subcommand only: `bellwether mcp` is `bellwether-mcp`.
bellwether-mcp = { path = "../bellwether-mcp" }
# `--emit`: the plan translated for a query engine (WP16).
bellwether-adapters = { path = "../bellwether-adapters" }
# `env`: BELLWETHER_SIGNING_KEY and BELLWETHER_TRUSTED_KEYS (paths only).
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `ci` reads the gate's configuration (`.bellwether/ci.toml`).
toml = "1"

[dev-dependencies]
# Writes the SQLite table the sql:// root tests read.
rusqlite = { version = "0.41", features = ["bundled"] }
assert_cmd = "2"
tempfile = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
# Runs the emitted DataFusion scan in tests/emit.rs (feature `datafusion`).
tokio = { workspace = true }

[lints]
workspace = true
