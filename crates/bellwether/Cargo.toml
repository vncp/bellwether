[package]
name = "bellwether"
description = "The Bellwether facade: one Engine whose every operation returns a typed, serializable result; the single code path the CLI and the MCP server share (ADR 010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bellwether-types = { path = "../bellwether-types" }
# Key spec validation and the canonical encoder's column types.
bellwether-core = { path = "../bellwether-core" }
# Parquet and text sources, fingerprint policies.
bellwether-source = { path = "../bellwether-source" }
# The index store (local or object store), the manifest, and the cache.
bellwether-store = { path = "../bellwether-store" }
# The only write path for records.
bellwether-ledger = { path = "../bellwether-ledger" }
# `index` (Builder) and `locate`/`latest`/`asof` (Planner).
bellwether-build = { path = "../bellwether-build" }
# The profile `why` computes and records as Evidence.
bellwether-profile = { path = "../bellwether-profile" }
# Workloads and exact replay for `why` and `fix`.
bellwether-replay = { path = "../bellwether-replay" }
# `reconcile`, and `fix`'s verify stage.
bellwether-verify = { path = "../bellwether-verify" }
# Workload-level physical design advisor (WP13a, M6).
bellwether-evolve = { path = "../bellwether-evolve" }
# Tables as sources (`sql://` roots, ADR 027): reconcile, why, and fix
# (verify, then an attest-only refusal) over a table.
bellwether-source-sql = { path = "../bellwether-source-sql" }
# Query engines as measured sources (ADR 033): the lake twin's engine, its
# identity, and the measured score and exports of a rewrite proposal.
bellwether-source-engine = { path = "../bellwether-source-engine" }
# Plans translated for query engines (`--emit`, MCP `emit`; WP16, ADR 010).
bellwether-adapters = { path = "../bellwether-adapters" }
arrow = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
roaring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
# Signing keys (ADR 029): a fresh seed from the operating system's RNG,
# wiped from memory after use; the trust file is TOML.
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
toml = "1"

[features]
# SQL Server tables through ODBC (links the system ODBC driver manager).
odbc = ["bellwether-source-sql/odbc"]

[dev-dependencies]
tempfile = { workspace = true }
# Writes the SQLite tables the table tests read.
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
