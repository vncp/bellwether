[package]
name = "bellwether-adapters"
description = "Bellwether scan plans executed inside query engines: DataFusion row-group access plans, DuckDB SQL over the planned files with pushed filters, and a Spark manifest and shim; the residual translated with typed literals, never dropped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# The DataFusion adapter's executable form: a `FileScanConfig` with one
# `ParquetAccessPlan` per file, the residual as a logical plan, and the
# byte-counting object store. Off by default because DataFusion is a large
# compile; the plan's description (`Artifact::DataFusion`) is always built.
datafusion = ["dep:datafusion", "dep:tokio", "dep:futures", "dep:async-trait"]

[dependencies]
bellwether-types = { path = "../bellwether-types" }
# Canonical decoding (`encoding::decode`), the expression language, text
# folding, and list elements: the residual's definitions.
bellwether-core = { path = "../bellwether-core" }
arrow = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
# The 55 line is built against arrow 59, the workspace's arrow.
datafusion = { version = "~55.2", default-features = false, features = ["parquet"], optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
roaring = { workspace = true }

[lints]
workspace = true
