[workspace]
resolver = "2"
members = [
    "crates/bellwether",
    "crates/bellwether-bench",
    "crates/bellwether-build",
    "crates/bellwether-cli",
    "crates/bellwether-core",
    "crates/bellwether-ledger",
    "crates/bellwether-mcp",
    "crates/bellwether-profile",
    "crates/bellwether-replay",
    "crates/bellwether-source",
    "crates/bellwether-source-sql",
    "crates/bellwether-source-engine",
    "crates/bellwether-store",
    "crates/bellwether-types",
    "crates/bellwether-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE.md"
repository = "https://github.com/vncp/bellwether"
authors = ["Vincent Pham"]
publish = false  # pre-alpha; flips at the 0.1.0 release together with an SPDX license form

[workspace.dependencies]
# shared, pinned once here; crates reference them with `workspace = true`
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
blake3 = "1"
bytes = "1"
roaring = "0.10"
arrow = "59.3"
arrow-schema = "59.3"
parquet = "59.3"
object_store = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tracing = "0.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = { version = "0.13", features = ["sync"] }
url = "2"
tempfile = "3"
proptest = "1"
criterion = "0.5"
# JSON Schema derives for the contract (the `schema` feature of
# bellwether-types, off by default) and the MCP server's tool schemas; the
# same major as rmcp's.
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
# Text keys (B5): the Unicode tables tokens are folded and split under.
# Each is pinned to one exact version, because a text segment records the
# version it was built under and a reader on another refuses it
# (bellwether-core's `text` module); bump them only on purpose, and the
# release notes then say to rebuild text keys.
# Word boundaries (UAX #29); already in the graph through comfy-table.
unicode-segmentation = "=1.13.3"
# Full case folding (CaseFolding.txt), with its own tables.
unicase = "=2.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
