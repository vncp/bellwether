<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1000" height="250" fill="#ffffff"/>
<rect x="25" y="30" width="300" height="190" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<circle cx="55" cy="64" r="16" fill="#0969da"/><text x="55" y="69" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text>
<text x="81" y="70" fill="#1f2328" font-size="20" font-weight="700">Ask</text>
<text x="47" y="106" fill="#0969da" font-size="13" font-family="SFMono-Regular,Menlo,Consolas,monospace">bellwether why ./data/</text>
<text x="47" y="134" fill="#656d76" font-size="13.5">Which column is a real key, and exactly</text>
<text x="47" y="153" fill="#656d76" font-size="13.5">how many bytes each index would save on</text>
<text x="47" y="172" fill="#656d76" font-size="13.5">your recorded queries.</text>
<path d="M333 125 L367 125" stroke="#656d76" stroke-width="2"/><path d="M361 118 L369 125 L361 132" fill="none" stroke="#656d76" stroke-width="2"/>
<rect x="375" y="30" width="300" height="190" rx="14" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
<circle cx="405" cy="64" r="16" fill="#9a6700"/><text x="405" y="69" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="431" y="70" fill="#1f2328" font-size="20" font-weight="700">Fix</text>
<text x="397" y="106" fill="#9a6700" font-size="13" font-family="SFMono-Regular,Menlo,Consolas,monospace">bellwether fix ./data/ --proposal …</text>
<text x="397" y="134" fill="#656d76" font-size="13.5">Scores, verifies the same rows come back,</text>
<text x="397" y="153" fill="#656d76" font-size="13.5">builds the index, and only then applies.</text>
<path d="M683 125 L717 125" stroke="#656d76" stroke-width="2"/><path d="M711 118 L719 125 L711 132" fill="none" stroke="#656d76" stroke-width="2"/>
<rect x="725" y="30" width="300" height="190" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
<circle cx="755" cy="64" r="16" fill="#1a7f37"/><text x="755" y="69" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text>
<text x="781" y="70" fill="#1f2328" font-size="20" font-weight="700">Proof</text>
<text x="747" y="106" fill="#1a7f37" font-size="13" font-family="SFMono-Regular,Menlo,Consolas,monospace">receipt + index</text>
<text x="747" y="134" fill="#656d76" font-size="13.5">A hash-linked receipt a reviewer or CI can</text>
<text x="747" y="153" fill="#656d76" font-size="13.5">check, and lookups in milliseconds over</text>
<text x="747" y="172" fill="#656d76" font-size="13.5">plain files.</text>
</svg>