<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 260" width="1050" height="260" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1050" height="260" fill="#ffffff"/>
<rect x="25" y="30" width="300" height="200" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<circle cx="55" cy="64" r="16" fill="#0969da"/><text x="55" y="69" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text>
<text x="81" y="70" fill="#1f2328" font-size="20" font-weight="700">Ask</text>
<text x="47" y="106" fill="#0969da" font-size="12.5" font-family="SFMono-Regular,Menlo,Consolas,monospace">bellwether why ./data/</text>
<text x="47" y="134" fill="#656d76" font-size="13">Which column is a real key, and</text>
<text x="47" y="153" fill="#656d76" font-size="13">exactly how many bytes each index</text>
<text x="47" y="172" fill="#656d76" font-size="13">would save on your recorded</text>
<text x="47" y="191" fill="#656d76" font-size="13">queries.</text>
<path d="M333 130 L367 130" stroke="#656d76" stroke-width="2"/><path d="M361 123 L369 130 L361 137" fill="none" stroke="#656d76" stroke-width="2"/>
<rect x="375" y="30" width="300" height="200" rx="14" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
<circle cx="405" cy="64" r="16" fill="#9a6700"/><text x="405" y="69" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="431" y="70" fill="#1f2328" font-size="20" font-weight="700">Fix</text>
<text x="397" y="106" fill="#9a6700" font-size="12.5" font-family="SFMono-Regular,Menlo,Consolas,monospace">bellwether fix ./data/ --proposal …</text>
<text x="397" y="134" fill="#656d76" font-size="13">Scores, verifies the same rows</text>
<text x="397" y="153" fill="#656d76" font-size="13">come back, builds the index, and</text>
<text x="397" y="172" fill="#656d76" font-size="13">only then applies.</text>
<path d="M683 130 L717 130" stroke="#656d76" stroke-width="2"/><path d="M711 123 L719 130 L711 137" fill="none" stroke="#656d76" stroke-width="2"/>
<rect x="725" y="30" width="300" height="200" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
<circle cx="755" cy="64" r="16" fill="#1a7f37"/><text x="755" y="69" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text>
<text x="781" y="70" fill="#1f2328" font-size="20" font-weight="700">Proof</text>
<text x="747" y="106" fill="#1a7f37" font-size="12.5" font-family="SFMono-Regular,Menlo,Consolas,monospace">receipt + index</text>
<text x="747" y="134" fill="#656d76" font-size="13">A hash-linked receipt a reviewer</text>
<text x="747" y="153" fill="#656d76" font-size="13">or CI can check, and lookups in</text>
<text x="747" y="172" fill="#656d76" font-size="13">milliseconds over plain files.</text>
</svg>