<text x="24.0" y="58.0" fill="#1f2328" font-size="15">Bellwether compared 40,664,186 rows at 232 k rows/s and named the planted change in 2 of 2 planted runs; DuckDB's EXCEPT ALL is 19.5×</text>
<text x="24.0" y="80.0" fill="#1f2328" font-size="15">faster on the same files and writes no certificate.</text>
<text x="24.0" y="98.0" fill="#656d76" font-size="12">Rows of both copies compared per second, one warm run each; Bellwether at its default 256 MiB memory budget. Apple M3 Pro, 12 cores, 36 GB, macOS 26.4.1, local SSD. DuckDB</text>
<text x="24.0" y="114.0" fill="#656d76" font-size="12">v2.0.0 (d54cbbe3df); bellwether release build of eca48d1 (rustc 1.99.1). Measured 2026-10-26.</text>
