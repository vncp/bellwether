<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 756" width="1100" height="756" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1100" height="756" fill="#ffffff" rx="12"/>
<text x="24.0" y="34.0" fill="#1f2328" font-size="18" font-weight="600">Time to answer each question</text>
<text x="24.0" y="58.0" fill="#1f2328" font-size="15">Planning first and then reading only the planned row groups was faster than DuckDB alone on 3 of 10 questions (best: the latest trip from</text>
<text x="24.0" y="80.0" fill="#1f2328" font-size="15">every pickup zone, 650 ms instead of 1.49 s); on small or already-pruned questions the planning step costs more than it saves.</text>
<text x="24.0" y="98.0" fill="#656d76" font-size="12">Median of 3 warm runs. DuckDB: the profiler's query time. Bellwether: the lookup verb's wall time (whole process) plus DuckDB's query time on the plan. Apple M3 Pro, 12 cores,</text>
<text x="24.0" y="114.0" fill="#656d76" font-size="12">36 GB, macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of eca48d1 (rustc 1.99.1). Measured 2026-10-25.</text>
<rect x="24.0" y="132.0" width="12.0" height="12.0" rx="2" fill="#0969da"/>
<text x="42.0" y="142.0" fill="#1f2328" font-size="13">DuckDB alone</text>
<rect x="156.4" y="132.0" width="12.0" height="12.0" rx="2" fill="#1a7f37"/>
<text x="174.4" y="142.0" fill="#1f2328" font-size="13">Bellwether plan + DuckDB on the plan</text>
<text x="24.0" y="186.0" fill="#1f2328" font-size="14" font-weight="600">NYC taxi</text>
<text x="430.0" y="206.0" fill="#1f2328" font-size="13" text-anchor="end">trips from 10 pickup zones in one week</text>
<rect x="442.0" y="194.0" width="220.0" height="11.0" rx="2" fill="#0969da"/>
<text x="668.0" y="204.0" fill="#1f2328" font-size="11"><tspan font-weight="600">102 ms</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
<rect x="442.0" y="208.0" width="241.7" height="11.0" rx="2" fill="#1a7f37"/>
<text x="689.7" y="218.0" fill="#1f2328" font-size="11"><tspan font-weight="600">161 ms</tspan><tspan fill="#656d76" font-size="10">  plan 92 ms + query 69 ms</tspan></text>
<text x="430.0" y="252.0" fill="#1f2328" font-size="13" text-anchor="end">the latest trip from every pickup zone</text>
<rect x="442.0" y="240.0" width="347.5" height="11.0" rx="2" fill="#0969da"/>
<text x="795.5" y="250.0" fill="#1f2328" font-size="11"><tspan font-weight="600">1.49 s</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
<rect x="442.0" y="254.0" width="308.0" height="11.0" rx="2" fill="#1a7f37"/>
<text x="756.0" y="264.0" fill="#1f2328" font-size="11"><tspan font-weight="600">650 ms</tspan><tspan fill="#656d76" font-size="10">  plan 225 ms + query 425 ms</tspan></text>
<text x="430.0" y="298.0" fill="#1f2328" font-size="13" text-anchor="end">each pickup zone's last trip before 1 March</text>
<rect x="442.0" y="286.0" width="297.9" height="11.0" rx="2" fill="#0969da"/>
<text x="745.9" y="296.0" fill="#1f2328" font-size="11"><tspan font-weight="600">525 ms</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
<rect x="442.0" y="300.0" width="313.6" height="11.0" rx="2" fill="#1a7f37"/>
<text x="761.6" y="310.0" fill="#1f2328" font-size="11"><tspan font-weight="600">731 ms</tspan><tspan fill="#656d76" font-size="10">  plan 205 ms + query 526 ms</tspan></text>
<text x="430.0" y="344.0" fill="#1f2328" font-size="13" text-anchor="end">trips from 10 pickup zones, all six months</text>
<rect x="442.0" y="332.0" width="262.6" height="11.0" rx="2" fill="#0969da"/>
<text x="710.6" y="342.0" fill="#1f2328" font-size="11"><tspan font-weight="600">250 ms</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
<rect x="442.0" y="346.0" width="259.2" height="11.0" rx="2" fill="#1a7f37"/>
<text x="707.2" y="356.0" fill="#1f2328" font-size="11"><tspan font-weight="600">233 ms</tspan><tspan fill="#656d76" font-size="10">  no plan: fix refused, every row group read</tspan></text>
<text x="24.0" y="396.0" fill="#1f2328" font-size="14" font-weight="600">GH Archive</text>
<text x="430.0" y="416.0" fill="#1f2328" font-size="13" text-anchor="end">events for 10 repositories</text>
<rect x="442.0" y="404.0" width="114.5" height="11.0" rx="2" fill="#0969da"/>
