<rect x="442.0" y="464.0" width="168.4" height="11.0" rx="2" fill="#1a7f37"/>
<text x="616.4" y="474.0" fill="#1f2328" font-size="11"><tspan font-weight="600">34 ms</tspan><tspan fill="#656d76" font-size="10">  plan 29 ms + query 5.1 ms</tspan></text>
<text x="430.0" y="508.0" fill="#1f2328" font-size="13" text-anchor="end">the latest event of 10 repositories</text>
<rect x="442.0" y="496.0" width="111.8" height="11.0" rx="2" fill="#0969da"/>
<text x="559.8" y="506.0" fill="#1f2328" font-size="11"><tspan font-weight="600">10 ms</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
<rect x="442.0" y="510.0" width="178.3" height="11.0" rx="2" fill="#1a7f37"/>
<text x="626.3" y="520.0" fill="#1f2328" font-size="11"><tspan font-weight="600">42 ms</tspan><tspan fill="#656d76" font-size="10">  plan 33 ms + query 9.2 ms</tspan></text>
<text x="430.0" y="554.0" fill="#1f2328" font-size="13" text-anchor="end">events for 1,000 repositories</text>
<rect x="442.0" y="542.0" width="149.5" height="11.0" rx="2" fill="#0969da"/>
<text x="597.5" y="552.0" fill="#1f2328" font-size="11"><tspan font-weight="600">23 ms</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
