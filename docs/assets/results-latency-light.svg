<text x="588.5" y="566.0" fill="#1f2328" font-size="11"><tspan font-weight="600">19 ms</tspan><tspan fill="#656d76" font-size="10">  no plan: fix refused, every row group read</tspan></text>
<text x="24.0" y="606.0" fill="#1f2328" font-size="14" font-weight="600">ClickBench</text>
<text x="430.0" y="626.0" fill="#1f2328" font-size="13" text-anchor="end">page views of 10 users</text>
<rect x="442.0" y="614.0" width="313.5" height="11.0" rx="2" fill="#0969da"/>
<text x="761.5" y="624.0" fill="#1f2328" font-size="11"><tspan font-weight="600">730 ms</tspan><tspan fill="#656d76" font-size="10"></tspan></text>
<rect x="442.0" y="628.0" width="351.2" height="11.0" rx="2" fill="#1a7f37"/>
<text x="799.2" y="638.0" fill="#1f2328" font-size="11"><tspan font-weight="600">1.61 s</tspan><tspan fill="#656d76" font-size="10">  plan 31 ms + query 1.58 s</tspan></text>
<text x="430.0" y="672.0" fill="#1f2328" font-size="13" text-anchor="end">page views of 1,000 users</text>
