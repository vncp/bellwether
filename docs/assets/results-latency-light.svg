<rect x="442.0" y="418.0" width="195.2" height="11.0" rx="2" fill="#1a7f37"/>
<text x="643.2" y="428.0" fill="#1f2328" font-size="11"><tspan font-weight="600">61 ms</tspan><tspan fill="#656d76" font-size="10">  plan 29 ms + query 32 ms</tspan></text>
<text x="430.0" y="462.0" fill="#1f2328" font-size="13" text-anchor="end">events for 10 repositories, 06:00 to 08:00</text>
