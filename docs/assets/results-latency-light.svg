<text x="756.0" y="238.0" fill="#1f2328" font-size="11"><tspan font-weight="600">650 ms</tspan><tspan fill="#656d76" font-size="10">  plan 225 ms + query 425 ms</tspan></text>
<text x="430.0" y="272.0" fill="#1f2328" font-size="13" text-anchor="end">each pickup zone's last trip before 1 March</text>
