<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 862" width="1100" height="862" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1100" height="862" fill="#ffffff" rx="12"/>
<text x="24.0" y="34.0" fill="#1f2328" font-size="18" font-weight="600">Time to answer each question</text>
<text x="24.0" y="58.0" fill="#1f2328" font-size="15">Planning first and then reading only the planned row groups was faster than DuckDB alone on 2 of 14 questions (best: the latest trip from</text>
<text x="24.0" y="80.0" fill="#1f2328" font-size="15">every pickup zone, 542 ms instead of 1.09 s); on small or already-pruned questions the planning step costs more than it saves.</text>
<text x="24.0" y="98.0" fill="#656d76" font-size="12">Median of 3 warm runs. DuckDB: the profiler's query time. Bellwether: the lookup verb's wall time (whole process) plus DuckDB's query time on the plan. Apple M3 Pro, 12 cores,</text>
<text x="24.0" y="114.0" fill="#656d76" font-size="12">36 GB, macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of eca48d1 (rustc 1.99.1). Measured 2026-10-26.</text>
