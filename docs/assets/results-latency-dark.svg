<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 906" width="1171" height="906" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1171" height="906" fill="#0d1117" rx="12"/>
<text x="24.0" y="34.0" fill="#e6edf3" font-size="18" font-weight="600">Time to answer each question</text>
<text x="24.0" y="58.0" fill="#e6edf3" font-size="15">Bellwether's plan plus DuckDB on the plan was faster than DuckDB alone on 2 of the 11 questions with a plan (the latest trip from every pickup</text>
<text x="24.0" y="80.0" fill="#e6edf3" font-size="15">zone: 467 ms against 913 ms). On 8, DuckDB on the plan took no more than 5% longer than DuckDB alone, and often less, but the plan step (one</text>
<text x="24.0" y="102.0" fill="#e6edf3" font-size="15">bellwether process, 25 ms to 176 ms) cost more than that saved. On 1, DuckDB read the plan's row-number ranges more slowly than it scans on its</text>
<text x="24.0" y="124.0" fill="#e6edf3" font-size="15">own (page views of 1,000 users: 27 row groups in 482 ms on the plan against 28 row groups in 452 ms alone).</text>
<text x="24.0" y="142.0" fill="#8b949e" font-size="12">Median of 3 warm runs. DuckDB: the profiler's query time. Bellwether: the lookup verb's wall time (a whole process) plus DuckDB's query time on the plan. Apple M3 Pro, 12 cores, 36 GB,</text>
<text x="24.0" y="158.0" fill="#8b949e" font-size="12">macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of 3a0c26a (rustc 1.99.1). Measured 2026-10-26. 1-minute load average while timing: 1.8 to 3.6 on 12 cores.</text>
