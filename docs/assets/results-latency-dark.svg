<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 900" width="1171" height="900" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1171" height="900" fill="#0d1117" rx="12"/>
<text x="24.0" y="34.0" fill="#e6edf3" font-size="18" font-weight="600">Time to answer each question</text>
<text x="24.0" y="58.0" fill="#e6edf3" font-size="15">Bellwether's plan plus DuckDB on the plan was faster than DuckDB alone on 2 of the 12 questions with a plan (the latest trip from every pickup</text>
<text x="24.0" y="80.0" fill="#e6edf3" font-size="15">zone: 544 ms against 1.09 s). On 10, DuckDB on the plan took no more than 5% longer than DuckDB alone, and often less, but the plan step (one</text>
<text x="24.0" y="102.0" fill="#e6edf3" font-size="15">bellwether process, 24 ms to 183 ms) cost more than that saved.</text>
<text x="24.0" y="120.0" fill="#8b949e" font-size="12">Median of 3 warm runs. DuckDB: the profiler's query time. Bellwether: the lookup verb's wall time (a whole process) plus DuckDB's query time on the plan. Apple M3 Pro, 12 cores, 36 GB,</text>
<text x="24.0" y="136.0" fill="#8b949e" font-size="12">macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of 7f3318f (rustc 1.99.1) for Market (synthetic); bellwether release build of eca48d1 (rustc 1.99.1) for NYC</text>
<text x="24.0" y="152.0" fill="#8b949e" font-size="12">taxi, GH Archive, ClickBench. Measured 2026-10-26. 1-minute load average while timing: 3.7 to 8.8 on 12 cores.</text>
