<text x="24.0" y="80.0" fill="#1f2328" font-size="15">second on one thread to 2,189 on all (2.5x; best 2,189 at all); market-default went from 1,083 row groups per second on one thread to</text>
<text x="24.0" y="102.0" fill="#1f2328" font-size="15">1,516 on all (1.4x; best 1,677 at 4).</text>
<text x="24.0" y="120.0" fill="#656d76" font-size="12">build_row_groups_per_s (row groups/s). Apple M3 Pro, 12 cores, 36 GiB, macOS 26.4.1, local SSD. bellwether release build of sources at f809e5403d08 (rustc 1.99.1; sha256</text>
<text x="24.0" y="136.0" fill="#656d76" font-size="12">3f05ece30dc0). Measured 2026-10-26.</text>
