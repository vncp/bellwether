<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1255 250" width="1255" height="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
<rect width="1255" height="250" fill="#ffffff"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<line x1="596" y1="48" x2="596" y2="215" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 6"/>
<text x="596" y="238" text-anchor="middle" fill="#cf222e" font-size="11" letter-spacing="2" font-weight="700">TRUST BOUNDARY</text>
<text x="290" y="30" text-anchor="middle" fill="#656d76" font-size="11" letter-spacing="2">AGENT MAY</text>
<text x="914" y="30" text-anchor="middle" fill="#656d76" font-size="11" letter-spacing="2">ONLY THE ENGINE MAY</text>
<rect x="20" y="50" width="237" height="118" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="139" y="78" text-anchor="middle" fill="#1f2328" font-weight="700">1 · observe</text>
<text x="139" y="102" text-anchor="middle" fill="#656d76">why · profile · locate</text>
<text x="139" y="120" text-anchor="middle" fill="#656d76">fanout, exact replay</text>
<text x="139" y="154" text-anchor="middle" fill="#0969da">→ Evidence</text>
<text x="139" y="192" text-anchor="middle" fill="#656d76" font-size="11">read-only · ms · from cache</text>
<line x1="259" y1="109.0" x2="288" y2="109.0" stroke="#656d76" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="291" y="50" width="268" height="118" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="425" y="78" text-anchor="middle" fill="#1f2328" font-weight="700">2 · propose</text>
<text x="425" y="102" text-anchor="middle" fill="#656d76">a key, a layout, a rewrite</text>
<text x="425" y="120" text-anchor="middle" fill="#656d76">no score field exists</text>
<text x="425" y="154" text-anchor="middle" fill="#0969da">→ Proposal</text>
<text x="425" y="192" text-anchor="middle" fill="#656d76" font-size="11">the agent may say anything here</text>
<line x1="562" y1="109.0" x2="610" y2="109.0" stroke="#656d76" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="614" y="50" width="284" height="118" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
<text x="755" y="78" text-anchor="middle" fill="#1f2328" font-weight="700">3 · score + verify</text>
<text x="755" y="102" text-anchor="middle" fill="#656d76">replay recorded keys: exact bytes</text>
<text x="755" y="120" text-anchor="middle" fill="#656d76">reconcile: same rows?</text>
<text x="755" y="154" text-anchor="middle" fill="#0969da">→ Replay, Certificate</text>
<text x="755" y="192" text-anchor="middle" fill="#656d76" font-size="11">deterministic given pinned inputs</text>
<line x1="899" y1="109.0" x2="928" y2="109.0" stroke="#656d76" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="931" y="50" width="284" height="118" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
<text x="1073" y="78" text-anchor="middle" fill="#1f2328" font-weight="700">4 · apply + attest</text>
<text x="1073" y="102" text-anchor="middle" fill="#656d76">refuses without a passing</text>
<text x="1073" y="120" text-anchor="middle" fill="#656d76">certificate; hash-links the chain</text>
<text x="1073" y="154" text-anchor="middle" fill="#0969da">→ Receipt</text>
<text x="1073" y="192" text-anchor="middle" fill="#656d76" font-size="11">the only record a human reads</text>
</svg>