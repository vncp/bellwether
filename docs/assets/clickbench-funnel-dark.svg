<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1000" height="330" fill="#0d1117" rx="12"/>
<text x="24" y="34" fill="#e6edf3" font-size="18" font-weight="600">ClickBench slice: row groups one lookup of 1,000 sampled users reads</text>
<text x="24" y="56" fill="#8b949e" font-size="13">28 row groups exist. Exact sums of row-group statistics, measured 2026-10-24 in a debug build.</text>
<text x="24" y="74" fill="#8b949e" font-size="13">Rows are not clustered by UserID, so even the perfect index saves 0.08% of the bytes. That layout is the finding.</text>
