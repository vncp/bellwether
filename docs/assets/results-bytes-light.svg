<text x="24.0" y="58.0" fill="#1f2328" font-size="15">For trips from 10 pickup zones in one week (1,090 trips), DuckDB read 25.5 MB following Bellwether's plan instead of 342.3 MB on its own;</text>
<text x="24.0" y="80.0" fill="#1f2328" font-size="15">3 of 10 questions read about the same either way, because DuckDB's own statistics already prune or the keys sit in nearly every row group.</text>
<text x="24.0" y="98.0" fill="#656d76" font-size="12">Bytes and row groups read per question. Full scan: footer sums. DuckDB and Bellwether: DuckDB's profiler; Bellwether = the same SQL on the plan's row groups. Apple M3 Pro, 12</text>
<text x="24.0" y="114.0" fill="#656d76" font-size="12">cores, 36 GB, macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of eca48d1 (rustc 1.99.1). Measured 2026-10-25.</text>
