<text x="24.0" y="58.0" fill="#1f2328" font-size="15">For the latest print of 6 symbols (Market (synthetic), 6 prints), DuckDB read 312.2 kB following Bellwether's plan instead of 12.5 MB on its own.</text>
<text x="24.0" y="80.0" fill="#1f2328" font-size="15">The plan read at least 5% less on 10 of 14 questions; these are those 10, biggest reduction first.</text>
<text x="24.0" y="98.0" fill="#656d76" font-size="12">Bytes and row groups read. Full scan: footer sums. DuckDB alone and on the plan: DuckDB's profiler, which also counts the footers it reads; the plan's row groups are selected by row</text>
<text x="24.0" y="114.0" fill="#656d76" font-size="12">number in the same SQL. Apple M3 Pro, 12 cores, 36 GB, macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of 7f3318f (rustc 1.99.1) for Market (synthetic);</text>
<text x="24.0" y="130.0" fill="#656d76" font-size="12">bellwether release build of eca48d1 (rustc 1.99.1) for NYC taxi, GH Archive, ClickBench. Measured 2026-10-26.</text>
