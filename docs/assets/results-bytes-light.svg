<text x="24.0" y="58.0" fill="#1f2328" font-size="15">For trips from 10 pickup zones in one week (NYC taxi, 1,090 trips), DuckDB read 25.5 MB following Bellwether's plan instead of 342.3 MB on</text>
<text x="24.0" y="80.0" fill="#1f2328" font-size="15">its own; the plan read less on 7 of 10 questions, shown here biggest reduction first.</text>
<text x="24.0" y="98.0" fill="#656d76" font-size="12">Bytes and row groups read per question. Full scan: footer sums. DuckDB alone and on the plan: DuckDB's profiler, the same SQL, the plan's row groups selected by row number.</text>
<text x="24.0" y="114.0" fill="#656d76" font-size="12">Apple M3 Pro, 12 cores, 36 GB, macOS 26.4.1, local SSD. DuckDB v2.0.0 (d54cbbe3df); bellwether release build of eca48d1 (rustc 1.99.1). Measured 2026-10-25.</text>
