<text x="39.6" y="203" textLength="195.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">3 apply   manifest 0 -&gt; 1</text>
<text x="39.6" y="221" textLength="639.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">4 attest  receipt 581b24e4cec250c011548a81edba571195b357822033315316b1e6e336618982</text>
<text x="117.6" y="239" textLength="686.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">receipt unsigned (no --signing-key; `bellwether keys generate --out &lt;path&gt;` makes a key)</text>
<text x="39.6" y="257" textLength="475.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">realized 130,336,047 bytes at manifest 1, replay b689d78654b4</text>
