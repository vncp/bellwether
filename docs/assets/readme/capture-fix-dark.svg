<title id="title">bellwether fix, then reconcile</title>
<desc id="desc">bellwether fix with the proposal and workload the why capture printed, then reconcile against a copy with one entity's amount raised by 0.01 (planted with DuckDB); the bench ledger corpus (bench generate --seed 42: 16 files, 64 row groups, 128,000 rows; bench workload: 12 recorded runs); debug build of 96b9369, 2026-10-26.</desc>
