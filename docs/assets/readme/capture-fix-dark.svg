<text x="39.6" y="131" textLength="756.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">1 score     134.0 MB -&gt;   130.3 MB over the workload (444 -&gt; 432 row groups), replay 92a1e68e3f18</text>
<text x="117.6" y="149" textLength="834.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">a lookup no key serves is priced as the files' own min/max statistics read it, as a reader without an index</text>
<text x="148.8" y="167" textLength="31.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">does</text>
