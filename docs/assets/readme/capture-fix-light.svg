<text x="55.2" y="473" textLength="202.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">rows differ            (3)</text>
<text x="39.6" y="509" textLength="218.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">exact totals, left and right</text>
<text x="55.2" y="527" textLength="803.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">amount           all rows                                1546909874.77            1546909874.78  DIFFER</text>
<text x="39.6" y="563" textLength="936.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">read 1 pass over each side under a 268,435,456-byte state budget (0 restarts): 128,000 rows read on the left, 128,000 on</text>
<text x="70.8" y="581" textLength="70.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">the right</text>
<text x="24.0" y="617" textLength="592.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">certificate ef2a6b7c05cea320b290b67d7bb8f8a0c8cf310d93f2d093aff0df75d3798ec8</text>
<text x="24.0" y="635" textLength="46.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#656d76">exit 1</tspan></text>
