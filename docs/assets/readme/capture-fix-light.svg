<text x="24.0" y="77" textLength="897.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#1a7f37">$ </tspan><tspan fill="#0969da">bellwether fix ledger/data --proposal 77b0d2f3f7cf2ceea87655d41b388ec7a98ebb513a5d6a744dc4e733c09d92f2 --workload</tspan></text>
<text x="70.8" y="95" textLength="499.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#0969da">3a1921721b730b1ea76a1933a0cb7cccae1f2d7f1cd90a2ebfd34228807cb842</tspan></text>
<text x="24.0" y="113" textLength="514.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">fix 77b0d2f3f7cf: key exact:entity_id, against manifest sequence 0</tspan></text>
<text x="39.6" y="131" textLength="756.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">1 score     134.0 MB -&gt;   130.3 MB over the workload (444 -&gt; 432 row groups), replay f9a3b6c77e5a</text>
<text x="117.6" y="149" textLength="834.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">a lookup no key serves is priced as the files' own min/max statistics read it, as a reader without an index</text>
<text x="148.8" y="167" textLength="31.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">does</text>
<text x="39.6" y="185" textLength="904.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">2 verify  pass, coverage workload, 935 keys, 0 mismatched, 0 missing left, 0 missing right, certificate 11fa443752ce</text>
<text x="39.6" y="203" textLength="195.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">3 apply   manifest 0 -&gt; 1</text>
<text x="39.6" y="221" textLength="639.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">4 attest  receipt ba492404b3dcff771d584d9868f00f8b85cd3da6bb341f65bbfd2fbd1cb33c62</text>
<text x="117.6" y="239" textLength="686.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">receipt unsigned (no --signing-key; `bellwether keys generate --out &lt;path&gt;` makes a key)</text>
<text x="39.6" y="257" textLength="475.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">realized 130,336,047 bytes at manifest 1, replay 07f155d7fc8b</text>
<text x="24.0" y="293" textLength="795.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#1a7f37">$ </tspan><tspan fill="#0969da">bellwether reconcile ledger/data changed/data --key entity_id --latest-by version_ts --totals amount</tspan></text>
<text x="24.0" y="311" textLength="234.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">reconcile: FAIL, coverage full</tspan></text>
<text x="39.6" y="329" textLength="288.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">keys compared                   6,855</text>
