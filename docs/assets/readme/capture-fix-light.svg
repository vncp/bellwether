<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 737" width="1000" height="737" role="img" aria-labelledby="title desc">
<title id="title">bellwether fix, then reconcile</title>
<desc id="desc">bellwether fix with the proposal and workload the why capture printed, then reconcile against a copy with one entity's amount raised by 0.01 (planted with DuckDB); the bench ledger corpus (bench generate --seed 42: 16 files, 64 row groups, 128,000 rows; bench workload: 12 recorded runs); debug build of 3b35ce7, 2026-10-26.</desc>
<rect x="0.5" y="0.5" width="999" height="736" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
