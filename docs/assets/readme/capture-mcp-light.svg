<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 989" width="1000" height="989" role="img" aria-labelledby="title desc">
<title id="title">bellwether mcp (stdio)</title>
<desc id="desc">A JSON-RPC session with bellwether mcp over stdio on the bench ledger corpus (bench generate --seed 42: 16 files, 64 row groups, 128,000 rows; bench workload: 12 recorded runs): observe.why, then propose.key with a score smuggled in; the request as sent, the reply pretty-printed with its session budget block elided, nothing else edited; release build of 3a0c26a, 2026-10-26.</desc>
<rect x="0.5" y="0.5" width="999" height="988" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<path d="M0.5 40V10.5a10 10 0 0 1 10-10H989.5a10 10 0 0 1 10 10V40Z" fill="#eaeef2"/>
<line x1="0.5" y1="40" x2="999.5" y2="40" stroke="#d0d7de"/>
<circle cx="22" cy="20.0" r="5.5" fill="#d0d7de"/>
<circle cx="40" cy="20.0" r="5.5" fill="#d0d7de"/>
<circle cx="58" cy="20.0" r="5.5" fill="#d0d7de"/>
<text x="500.0" y="24.5" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">bellwether mcp (stdio)</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328">
<text x="24.0" y="77" textLength="218.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#1a7f37">$ </tspan><tspan fill="#0969da">bellwether mcp ledger/data</tspan></text>
<text x="24.0" y="95" textLength="553.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#656d76">(initialize, then observe.why, which returned evidence 4cdbff1e45e6...)</tspan></text>
<text x="24.0" y="113" textLength="265.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#656d76">client -&gt; server, the line as sent</tspan></text>
<text x="24.0" y="131" textLength="904.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">{&quot;jsonrpc&quot;: &quot;2.0&quot;, &quot;id&quot;: 3, &quot;method&quot;: &quot;tools/call&quot;, &quot;params&quot;: {&quot;name&quot;: &quot;propose.key&quot;, &quot;arguments&quot;: {&quot;spec&quot;: {&quot;kind&quot;:</text>
<text x="55.2" y="149" textLength="912.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;exact&quot;, &quot;columns&quot;: [&quot;entity_id&quot;]}, &quot;evidence&quot;: [&quot;4cdbff1e45e6737cee98ee43f60567bd7dc342cb670d78c39ebb66aab047fe32&quot;],</text>
<text x="55.2" y="167" textLength="296.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;by&quot;: &quot;coding-agent&quot;, &quot;score&quot;: 0.99}}}</text>
<text x="24.0" y="185" textLength="507.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre"><tspan fill="#656d76">server -&gt; client, pretty-printed; the session budget block elided</tspan></text>
<text x="24.0" y="203" textLength="7.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">{</text>
<text x="39.6" y="221" textLength="132.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;jsonrpc&quot;: &quot;2.0&quot;,</text>
<text x="39.6" y="239" textLength="62.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;id&quot;: 3,</text>
<text x="39.6" y="257" textLength="85.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;result&quot;: {</text>
<text x="55.2" y="275" textLength="93.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;content&quot;: [</text>
<text x="70.8" y="293" textLength="7.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">{</text>
<text x="86.4" y="311" textLength="117.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;type&quot;: &quot;text&quot;,</text>
<text x="86.4" y="329" textLength="881.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;text&quot;: &quot;{\&quot;code\&quot;:\&quot;caller_supplied_cost\&quot;,\&quot;message\&quot;:\&quot;propose.key was given `score`: a caller cannot supply a</text>
<text x="117.6" y="347" textLength="717.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">cost, a measurement, a replay, a verdict, or a certificate; the engine measures and verifies</text>
<text x="117.6" y="365" textLength="842.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">itself\&quot;,\&quot;next\&quot;:\&quot;remove the field `fields.field` names and call again; the engine measures, verifies, and</text>
<text x="117.6" y="383" textLength="756.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">attests on its own\&quot;,\&quot;fields\&quot;:{\&quot;errors\&quot;:[\&quot;Additional properties are not allowed ('score' was</text>
<text x="117.6" y="401" textLength="288.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">unexpected)\&quot;],\&quot;field\&quot;:\&quot;score\&quot;}}&quot;</text>
<text x="70.8" y="419" textLength="7.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">}</text>
<text x="55.2" y="437" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">],</text>
<text x="55.2" y="455" textLength="171.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;structuredContent&quot;: {</text>
<text x="70.8" y="473" textLength="124.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;budget&quot;: { … },</text>
<text x="70.8" y="491" textLength="101.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;chains&quot;: [],</text>
<text x="70.8" y="509" textLength="93.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;cites&quot;: [],</text>
<text x="70.8" y="527" textLength="93.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;job&quot;: null,</text>
<text x="70.8" y="545" textLength="93.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;refusal&quot;: {</text>
<text x="86.4" y="563" textLength="241.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;code&quot;: &quot;caller_supplied_cost&quot;,</text>
<text x="86.4" y="581" textLength="85.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;fields&quot;: {</text>
<text x="102.0" y="599" textLength="85.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;errors&quot;: [</text>
<text x="117.6" y="617" textLength="499.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;Additional properties are not allowed ('score' was unexpected)&quot;</text>
<text x="102.0" y="635" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">],</text>
<text x="102.0" y="653" textLength="124.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;field&quot;: &quot;score&quot;</text>
<text x="86.4" y="671" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">},</text>
<text x="86.4" y="689" textLength="889.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;message&quot;: &quot;propose.key was given `score`: a caller cannot supply a cost, a measurement, a replay, a verdict, or a</text>
<text x="117.6" y="707" textLength="421.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">certificate; the engine measures and verifies itself&quot;,</text>
<text x="86.4" y="725" textLength="873.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;next&quot;: &quot;remove the field `fields.field` names and call again; the engine measures, verifies, and attests on its</text>
<text x="117.6" y="743" textLength="31.2" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">own&quot;</text>
<text x="70.8" y="761" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">},</text>
<text x="70.8" y="779" textLength="156.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;status&quot;: &quot;refused&quot;,</text>
<text x="70.8" y="797" textLength="140.4" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;tier&quot;: &quot;propose&quot;,</text>
<text x="70.8" y="815" textLength="163.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;tool&quot;: &quot;propose.key&quot;</text>
<text x="55.2" y="833" textLength="15.6" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">},</text>
<text x="55.2" y="851" textLength="117.0" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">&quot;isError&quot;: true</text>
<text x="39.6" y="869" textLength="7.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">}</text>
<text x="24.0" y="887" textLength="7.8" lengthAdjust="spacing" xml:space="preserve" style="white-space:pre">}</text>
</g>
