<text x="24" y="988" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#656d76">bellwether why on the bench ledger corpus (bench generate --seed 42: 16 files, 64 row groups, 128,000 rows; bench workload: 12 recorded runs), nothing</text>
<text x="24" y="1005" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#656d76">indexed; debug build of eca48d1, 2026-10-26.</text>
</svg>
