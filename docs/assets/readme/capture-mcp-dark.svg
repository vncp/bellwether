<title id="title">bellwether mcp (stdio)</title>
<desc id="desc">A JSON-RPC session with bellwether mcp over stdio on the bench ledger corpus (bench generate --seed 42: 16 files, 64 row groups, 128,000 rows; bench workload: 12 recorded runs): observe.why, then propose.key with a score smuggled in; the request as sent, the reply pretty-printed, nothing else edited; debug build of eca48d1, 2026-10-26.</desc>
