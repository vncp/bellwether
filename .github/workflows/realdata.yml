name: realdata

on:
  schedule:
    - cron: "41 7 * * *"  # nightly, 07:41 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  realdata:
    name: every CLI verb on taxi and GitHub event data (release build)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install the DuckDB command-line tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/duckdb && cd /tmp/duckdb
          gh release download --repo duckdb/duckdb --pattern 'duckdb-cli-linux-amd64.tar.gz'
          tar -xzf duckdb-cli-linux-amd64.tar.gz && sudo install -m 0755 duckdb /usr/local/bin/duckdb
          duckdb -no-agent --version
      - name: run the real-data script
        env:
          REALDATA_DIR: ${{ runner.temp }}/realdata
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-realdata
        run: scripts/realdata.sh
      - name: publish the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realdata-transcript
          path: ${{ runner.temp }}/realdata/out
          if-no-files-found: warn
      - name: fail on any CHECK FAIL in the transcript
        if: always()
        run: |
          t="${{ runner.temp }}/realdata/out/transcript.txt"
          test -f "$t" || { echo "no transcript produced"; exit 1; }
          echo "checks: $(grep -c 'CHECK PASS' "$t") passed, $(grep -c 'CHECK FAIL' "$t") failed"
          grep 'CHECK FAIL' "$t" && exit 1 || true
