name: release

# Builds `bellwether` (crates/bellwether-cli) in --release --locked for the
# four targets action/install.sh supports, packs each executable alone at
# the archive root as bellwether-<tag>-<target>.tar.gz (`bellwether`, or
# `bellwether.exe` for x86_64-pc-windows-msvc), lists and unpacks each
# archive and runs what it holds on the runner that built it, writes
# checksums.txt, runs action/install.sh against the archives and
# checksums.txt with a local stand-in for `gh` on Linux and native Windows,
# uploads everything as workflow artifacts, and only on a `v*` tag publishes
# the GitHub Release.
#
# A pull request that changes the packaging runs every job except publish,
# as a dry run tagged v0.1.0-dry-run; nothing is published from it.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - action/install.sh
      - action/tests/install-checksum.sh
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to name the archives after (dry run when dispatched)"
        required: false
        default: v0.1.0-dry-run
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Windows executable carries its C runtime, so it runs without the
  # Visual C++ Redistributable installed. Applies to that target only.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  tag:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v0.1.0-dry-run"
          fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::release tag must match [A-Za-z0-9._-]+, not $tag"
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe: bellwether
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            exe: bellwether
          - target: aarch64-apple-darwin
            os: macos-14
            exe: bellwether
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: bellwether.exe
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build bellwether (--release --locked)
        run: cargo build -p bellwether-cli --bin bellwether --release --locked --target ${{ matrix.target }}

      - name: package bellwether-${{ needs.tag.outputs.tag }}-${{ matrix.target }}.tar.gz
        shell: bash
        run: |
          dist="$RUNNER_TEMP/dist"
          archive="bellwether-$TAG-$TARGET.tar.gz"
          mkdir -p "$dist/stage"
          cp "target/$TARGET/release/$EXE" "$dist/stage/$EXE"
          chmod +x "$dist/stage/$EXE"
          "$dist/stage/$EXE" --version
          # Relative archive names throughout: Git Bash's GNU tar reads
          # D:\... as a file on host D.
          (cd "$dist/stage" && COPYFILE_DISABLE=1 tar -czf "../$archive" "$EXE")

      - name: the archive holds only ${{ matrix.exe }}, which runs once unpacked
        shell: bash
        run: |
          dist="$RUNNER_TEMP/dist"
          archive="bellwether-$TAG-$TARGET.tar.gz"
          members=$(tar -tzf - < "$dist/$archive")
          if [ "$members" != "$EXE" ]; then
            echo "::error::$archive holds [$members], not exactly $EXE"
            exit 1
          fi
          mkdir -p "$dist/unpacked"
          (cd "$dist/unpacked" && tar -xzf - "$EXE") < "$dist/$archive"
          "$dist/unpacked/$EXE" --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/bellwether-${{ needs.tag.outputs.tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  finalize:
    name: checksums.txt
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: download built archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: compute checksums.txt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            test -f "bellwether-$TAG-$target.tar.gz"
          done
          sha256sum "bellwether-$TAG-"*.tar.gz > checksums.txt
          test "$(wc -l < checksums.txt)" -eq 4
          cat checksums.txt

      - name: upload release archives and checksums.txt as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bellwether-${{ needs.tag.outputs.tag }}
          path: |
            ${{ runner.temp }}/release/bellwether-${{ needs.tag.outputs.tag }}-*.tar.gz
            ${{ runner.temp }}/release/checksums.txt
          if-no-files-found: error

  verify-install:
    name: install.sh (${{ matrix.target }})
    needs: [tag, finalize]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: bellwether-${{ needs.tag.outputs.tag }}
          path: ${{ runner.temp }}/release

      - name: action/install.sh downloads, checks, and unpacks the ${{ matrix.target }} archive
        shell: bash
        env:
          EXPECTED_ASSET: bellwether-${{ needs.tag.outputs.tag }}-${{ matrix.target }}.tar.gz
          BELLWETHER_RELEASES: ${{ github.repository }}
        run: |
          # A POSIX path: PATH splits on `:`, which a Windows D:\ has.
          mock="$(cd "$RUNNER_TEMP" && pwd)/mock-bin"
          mkdir -p "$mock"
          cat > "$mock/gh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "$1" = release ] && [ "$2" = download ] || { echo "mock gh: unexpected $*" >&2; exit 2; }
          tag=$3
          shift 3
          dir=""
          patterns=()
          while [ $# -gt 0 ]; do
            case "$1" in
              --repo) shift 2 ;;
              --pattern) patterns+=("$2"); shift 2 ;;
              --dir) dir=$2; shift 2 ;;
              --clobber) shift ;;
              *) echo "mock gh: unexpected arg $1" >&2; exit 2 ;;
            esac
          done
          [ "$tag" = "$TAG" ] || { echo "mock gh: unexpected tag $tag" >&2; exit 2; }
          [ "${patterns[*]}" = "$EXPECTED_ASSET checksums.txt" ] || { echo "mock gh: unexpected patterns ${patterns[*]}" >&2; exit 2; }
          for p in "${patterns[@]}"; do
            cp "$RELEASE_DIR/$p" "$dir/$p"
          done
          EOF
          chmod +x "$mock/gh"
          # The runner's own RUNNER_TEMP and GITHUB_PATH, so the next step
          # finds bellwether the way a workflow using the Action does.
          PATH="$mock:$PATH" \
            RELEASE_DIR="$RUNNER_TEMP/release" \
            BELLWETHER_VERSION="$TAG" \
            action/install.sh

      - name: bellwether is on PATH (bash)
        shell: bash
        run: bellwether --version

      - name: bellwether is on PATH (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Command bellwether).Source
          & bellwether --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: publish the GitHub Release
    # Never from a pull request, whose ref is refs/pull/<n>/merge: only a
    # `v*` tag publishes.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    needs: [tag, finalize, verify-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: bellwether-${{ needs.tag.outputs.tag }}
          path: ${{ runner.temp }}/release

      - name: publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/release"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "bellwether-$TAG-"*.tar.gz checksums.txt
