# cargo-deny: supply-chain and license policy, enforced in CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry below is transitive through a pinned major version and is
# removed by the planned upgrade of object_store (0.11 -> current) and
# arrow/parquet (53 -> current) scheduled at the start of Phase 3
# (docs/work-packages.md, "Dependency upgrade"). Each is reviewed then.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37 via object_store 0.11; XML DoS only reachable when parsing cloud-store responses; fixed by the object_store upgrade" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.37 via object_store 0.11; same path and fix as RUSTSEC-2026-0194" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, via object_store 0.11; dropped by the object_store upgrade" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, proc-macro via parquet 53; dropped by the arrow/parquet upgrade" },
  { id = "RUSTSEC-2024-0384", reason = "instant unmaintained, wasm32-only dependency of datafusion-common 43, the line pinned to arrow 53 for the optional bench DataFusion baseline; dropped by the arrow/parquet upgrade" },
]

[licenses]
version = 2
# Workspace crates carry a custom license text (MIT plus a hosted-service
# provision, LICENSE.md) rather than an SPDX expression, so they are marked
# publish = false until the 0.1.0 release decides the SPDX form.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
