# cargo-deny: supply-chain and license policy, enforced in CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No advisory is ignored. The Phase 3 dependency upgrade (2026-10-24) removed
# the five transitive ignores that the arrow 53 / object_store 0.11 /
# DataFusion 43 pins required; a new ignore needs a dated reason naming the
# crate that pulls it and the upstream issue.
ignore = []

[licenses]
version = 2
# Workspace crates carry a custom license text (MIT plus a hosted-service
# provision, LICENSE.md) rather than an SPDX expression, so they are marked
# publish = false until the 0.1.0 release decides the SPDX form.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9
# webpki-root-certs is Mozilla's CA root bundle (data only), reached through
# object_store 0.14 -> reqwest 0.13 (rustls) -> rustls-platform-verifier;
# allowed for that crate alone by the 2026-10-24 dependency upgrade.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
