# cargo-deny: supply-chain and license policy, enforced in CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# The Phase 3 dependency upgrade (2026-10-24) removed the five transitive
# ignores that the arrow 53 / object_store 0.11 / DataFusion 43 pins
# required; a new ignore needs a dated reason naming the crate that pulls it
# and the upstream issue.
ignore = [
  # 2026-10-26: parquet 59 and arrow-ipc 59 pin zstd ^0.13 (zstd-safe 7);
  # the fixes are in zstd 0.14.3 / zstd-safe 8.2.0, which only parquet and
  # arrow 60 accept. The parquet 60 upgrade is tracked in
  # https://github.com/vncp/bellwether/issues/28 and also waits on
  # DataFusion 56 (the bench `datafusion` baseline; DataFusion 55.2, the
  # latest release, pins parquet 59). Not reachable from Bellwether: parquet
  # and arrow-ipc 59 call only zstd::bulk (CCtx::compress2,
  # DCtx::decompress), never the affected stream `with_context` constructors
  # (0391) or DCtx::decompress_stream (0403). RUSTSEC-2026-0410 (zstd-sys) is
  # fixed in the lock: zstd-sys 2.1.2 is semver-compatible with zstd-safe 7.
  { id = "RUSTSEC-2026-0391", reason = "parquet 59 pins zstd 0.13; parquet 60 upgrade tracked in #28 (2026-10-26); unreachable: only zstd::bulk is used" },
  { id = "RUSTSEC-2026-0403", reason = "parquet 59 pins zstd-safe 7; parquet 60 upgrade tracked in #28 (2026-10-26); unreachable: DCtx::decompress_stream is not called" },
]

[licenses]
version = 2
# Workspace crates carry a custom license text (MIT plus a hosted-service
# provision, LICENSE.md) rather than an SPDX expression, so they are marked
# publish = false until the 0.1.0 release decides the SPDX form.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9
# webpki-root-certs is Mozilla's CA root bundle (data only), reached through
# object_store 0.14 -> reqwest 0.13 (rustls) -> rustls-platform-verifier;
# allowed for that crate alone by the 2026-10-24 dependency upgrade.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
# borrow-or-share is MIT No Attribution (permissive, no conditions), reached
# through bellwether-mcp -> jsonschema (tool-argument validation) ->
# referencing -> fluent-uri; allowed for that crate alone by WP12.
[[licenses.exceptions]]
crate = "borrow-or-share"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
